name: Android and UI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Configure Android SDK path
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Build, test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Build fixed-signature release and upgrade fixtures
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: bash tools/ci-build-signed.sh
      - name: Upload fixed-signature release
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pocket-release
          retention-days: 14
          path: ${{ runner.temp }}/codex-pocket-release/
      - name: Upload upgrade test APKs
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pocket-upgrade-fixtures
          retention-days: 3
          path: ${{ runner.temp }}/codex-pocket-upgrade/
      - name: Upload test APK and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pocket-debug-and-reports
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools
      - run: npm test
        working-directory: tools
      - name: Upload UI previews and test result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pocket-ui-results
          retention-days: 14
          path: tools/test-results/
  android-upgrade:
    needs: android
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-pocket-upgrade-fixtures
          path: upgrade-assets
      - name: Prepare ephemeral SSH fixture
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/ssh-fixture-deps" paramiko==4.0.0
          python3 -c 'import zipfile,sys; zipfile.ZipFile("upgrade-assets/android-test.apk").extract("assets/ssh-fixture.json",sys.argv[1])' "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/ssh-fixture-deps" python3 tools/ci-ssh-fixture.py serve "$RUNNER_TEMP/assets/ssh-fixture.json" > "$RUNNER_TEMP/ssh-fixture.log" 2>&1 &
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Android SSH, log retention and signed upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r upgrade-assets/base.apk
            adb install -r upgrade-assets/android-test.apk
            adb shell am instrument -w -e stage write dev.codexpocket.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/instrument-write.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/instrument-write.txt"
            adb shell am force-stop dev.codexpocket
            adb install -r upgrade-assets/upgrade.apk
            adb shell am instrument -w -e stage read dev.codexpocket.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/instrument-read.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/instrument-read.txt"
      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-pocket-android-upgrade-results-api-${{ matrix.api }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/instrument-*.txt
            ${{ runner.temp }}/ssh-fixture.log
