plugins { id 'com.android.application' }
android {
    namespace 'dev.codexpocket'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'dev.codexpocket'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    buildTypes { release { minifyEnabled false } }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'] }
}
dependencies {
    implementation 'com.github.mwiede:jsch:2.28.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
