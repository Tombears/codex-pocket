<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Codex Pocket</title><link rel="stylesheet" href="app.css"><script src="vendor/marked.js" defer></script><script src="vendor/purify.js" defer></script><script src="vendor/highlight.js" defer></script><script src="markdown.js" defer></script><script src="app.js" defer></script></head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 1 1 17-5Z"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m10 3-.6 3-2.5 1-2.6-1.1-2 3.5 2 2v2.2l-2 2 2 3.5L7 18l2.4 1 .6 3h4l.6-3 2.4-1 2.7 1.1 2-3.5-2-2v-2.2l2-2-2-3.5L17 7l-2.4-1-.6-3Z"/><circle cx="12" cy="12.5" r="3"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h16"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 7a9 9 0 0 0-15-3L2 7m0-5v5h5M4 17a9 9 0 0 0 15 3l3-3m0 5v-5h-5"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V4h7l3 3h8v13H3Z"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></symbol>
</defs></svg>
<button id="scrim" class="scrim" aria-label="关闭侧栏"></button>
<aside id="sidebar">
  <div class="brand"><span class="brand-icon"><svg><use href="#i-code"/></svg></span><div>Codex <span class="brand-light">Pocket</span><small>你的远程开发空间</small></div><button class="icon mobile" data-action="sidebar" aria-label="关闭侧栏"><svg><use href="#i-close"/></svg></button></div>
  <button class="new-chat" data-action="newChat"><svg><use href="#i-plus"/></svg>新建聊天<span>＋</span></button>
  <label class="search"><svg><use href="#i-search"/></svg><input id="search" placeholder="搜索聊天记录" aria-label="搜索聊天记录"></label>
  <div class="section-label">虚拟机工作区<button class="icon" data-action="addHost" aria-label="添加虚拟机"><svg><use href="#i-plus"/></svg></button></div>
  <nav id="hosts" aria-label="虚拟机与聊天记录"></nav>
  <div class="sidebar-bottom"><div class="private-note"><svg><use href="#i-shield"/></svg>SSH 直连 · 凭据本地加密</div><button class="settings-row" data-action="settings"><span class="avatar">C</span><span>设置与连接<small>管理你的工作空间</small></span><svg><use href="#i-settings"/></svg></button></div>
</aside>
<main>
  <header><div class="header-left"><button class="icon mobile" data-action="sidebar" aria-label="展开侧栏"><svg><use href="#i-menu"/></svg></button><span class="header-brand">Codex <span>Pocket</span></span><span class="header-divider"></span><button id="host-pill" class="host-pill" data-action="hostInfo"></button></div><div class="header-right"><span id="connection-status" class="connection"></span><button class="icon" data-action="newChat" aria-label="新建聊天"><svg><use href="#i-edit"/></svg></button><button class="icon" data-action="settings" aria-label="设置"><svg><use href="#i-settings"/></svg></button></div></header>
  <div id="workspace-bar" class="workspace-bar"></div>
  <section id="conversation" aria-live="polite"><div id="welcome"></div><div id="messages"></div><div id="working" hidden><span class="pulse"></span>Codex 正在工作<span class="working-dots">···</span></div></section>
  <footer><div class="composer-wrap"><div id="composer-context"></div><div class="composer"><textarea id="prompt" rows="1" placeholder="告诉 Codex 你想做什么…" aria-label="发送给 Codex 的消息"></textarea><div class="composer-bottom"><div><span class="codex-chip"><svg><use href="#i-code"/></svg>Codex</span><span id="mode-label">按需审批</span></div><button id="send" class="send" aria-label="发送消息"><svg><use href="#i-arrow"/></svg></button></div></div><p class="footer-note"><svg><use href="#i-shield"/></svg>任务在你的服务器上执行<span> · </span>重要操作请核对执行结果</p></div></footer>
</main>
<dialog id="dialog"><div id="dialog-content"></div></dialog><div id="toast" role="status"></div>
</body></html>
